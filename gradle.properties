org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# Dirección del backend. Para un teléfono físico en la misma red usa la IP de la computadora
# fqs.api.debug=http://192.168.1.50:3000/
# fqs.api.release=https://api.tu-dominio.mx/

# Fijación de certificado para la versión release (opcional). Ver docs/seguridad/fijacion-certificado.md del backend
# Dos huellas como mínimo, la del certificado actual y una de respaldo
# fqs.api.pins=sha256/AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=,sha256/BBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBBB=
