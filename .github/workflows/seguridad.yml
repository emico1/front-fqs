# Compila la app, corre Android Lint (que incluye revisiones de seguridad como
# almacenamiento inseguro, WebView, exportación de componentes y criptografía débil),
# CodeQL para Kotlin y gitleaks sobre todo el historial.
# Antes de usar ./gradlew se valida que gradle-wrapper.jar sea uno oficial de Gradle. Un
# jar alterado en un pull request podría ejecutar código en la máquina de CI.
# google-services.json no es secreto, pero si no está en el repositorio se crea desde el
# secreto GOOGLE_SERVICES_JSON del repositorio (el archivo completo en base64).
name: Seguridad de la app

on:
  push:
  pull_request:
  schedule:
    - cron: '0 14 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  compilar-y-analizar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/wrapper-validation@v4
      - uses: gradle/actions/setup-gradle@v4
      - name: google-services.json
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ ! -f app/google-services.json ] && [ -n "$GOOGLE_SERVICES_JSON" ]; then
            echo "$GOOGLE_SERVICES_JSON" | base64 -d > app/google-services.json
          fi
      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin
          build-mode: manual
          queries: security-extended
      - name: Compilar
        run: ./gradlew --no-daemon assembleDebug
      - uses: github/codeql-action/analyze@v3
        with:
          category: /language:java-kotlin
      - name: Android Lint
        run: ./gradlew --no-daemon lintDebug
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reporte-lint
          path: app/build/reports/lint-results-debug.html

  secretos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.28.0 \
            git /repo --redact --verbose --exit-code 1
